[package]
name = "velnoxapp-admin"
version = "0.1.0"
description = "Velnox.app Admin Panel - Desktop Application"
authors = ["Velnox"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1", features = ["shell-open"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
